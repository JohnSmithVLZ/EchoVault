<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анонимные идеи EchoVault</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 700px; margin: 0 auto; padding: 20px;
    background: #f5f7fa; color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 90px; padding: 12px;
    border: 1px solid #ddd; border-radius: 8px;
    font-family: inherit; font-size: 1rem; resize: vertical;
  }
  textarea:focus { outline: 2px solid #4f46e5; border-color: transparent; }
  .tags-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
  }
  .tag-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; font-size: 0.9rem;
    transition: all 0.15s;
  }
  .tag-btn:hover { border-color: #4f46e5; }
  .tag-btn.active {
    background: #4f46e5; color: #fff; border-color: #4f46e5;
  }
  button.send {
    background: #4f46e5; color: #fff; border: none;
    padding: 12px 24px; border-radius: 8px; font-size: 1rem;
    font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  button.send:hover { background: #4338ca; }
  button.send:disabled { background: #aaa; cursor: not-allowed; }
  .status { font-size: 0.85rem; color: #666; margin-top: 6px; }
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filters button {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; font-size: 0.85rem;
  }
  .filters button.active {
    background: #1a1a1a; color: #fff; border-color: #1a1a1a;
  }
  .idea {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .idea-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .badge {
    font-size: 0.75rem; padding: 3px 10px; border-radius: 12px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge.idea { background: #e0e7ff; color: #3730a3; }
  .badge.problem { background: #fee2e2; color: #991b1b; }
  .badge.question { background: #fef3c7; color: #92400e; }
  .badge.other { background: #e5e7eb; color: #374151; }
  .idea-text { font-size: 1rem; line-height: 1.5; }
  .idea-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f0f0;
  }
  .meta { color: #999; font-size: 0.8rem; }
  .like-btn {
    background: #f3f4f6; border: none; padding: 6px 14px;
    border-radius: 20px; cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .like-btn:hover { background: #e5e7eb; }
  .like-btn.liked {
    background: #4f46e5; color: #fff; cursor: default;
  }
  .like-btn.liked:hover { background: #4f46e5; }
  .empty { text-align: center; color: #999; padding: 40px 0; }
</style>
</head>
<body>
<h1>💡 Анонимные идеи EchoVault</h1>
<p class="subtitle">Поделитесь мыслью или предложением. Никто не узнает, кто это написал.</p>

<div class="card">
  <textarea id="ideaInput" placeholder="Ваша идея или предложение..."></textarea>
  <div class="tags-row" id="tagRow">
    <button class="tag-btn active" data-tag="idea">💡 Идея</button>
    <button class="tag-btn" data-tag="problem">⚠️ Проблема</button>
    <button class="tag-btn" data-tag="question">❓ Вопрос</button>
    <button class="tag-btn" data-tag="other">💬 Другое</button>
  </div>
  <button class="send" id="sendBtn" onclick="sendIdea()">Отправить анонимно</button>
  <div class="status" id="status"></div>
</div>

<div class="filters" id="filters">
  <button class="active" data-filter="">Все</button>
  <button data-filter="idea">💡 Идеи</button>
  <button data-filter="problem">⚠️ Проблемы</button>
  <button data-filter="question">❓ Вопросы</button>
  <button data-filter="other">💬 Другое</button>
</div>

<div id="ideasList"></div>

<script>
  const input = document.getElementById('ideaInput');
  const btn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const list = document.getElementById('ideasList');
  const filters = document.getElementById('filters');

  let selectedTag = 'idea';
  let currentFilter = '';

  const TAG_LABELS = {
    idea: '💡 Идея',
    problem: '⚠️ Проблема',
    question: '❓ Вопрос',
    other: '💬 Другое'
  };

  // Выбор тега при отправке
  document.getElementById('tagRow').addEventListener('click', e => {
    if (!e.target.classList.contains('tag-btn')) return;
    document.querySelectorAll('#tagRow .tag-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedTag = e.target.dataset.tag;
  });

  // Фильтры
  filters.addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    loadIdeas();
  });

  // Получаем список лайкнутых из localStorage
  function getLiked() {
    try { return JSON.parse(localStorage.getItem('liked') || '[]'); }
    catch { return []; }
  }
  function setLiked(arr) {
    localStorage.setItem('liked', JSON.stringify(arr));
  }

  async function loadIdeas() {
    const url = currentFilter ? `/api/ideas?tag=${currentFilter}` : '/api/ideas';
    const res = await fetch(url);
    const data = await res.json();

    if (!data.length) {
      list.innerHTML = '<div class="empty">Пока идей нет. Будьте первым!</div>';
      return;
    }

    const liked = getLiked();

    list.innerHTML = data.map(i => {
      const isLiked = liked.includes(i.id);
      return `
        <div class="idea">
          <div class="idea-head">
            <span class="badge ${i.tag}">${TAG_LABELS[i.tag] || i.tag}</span>
          </div>
          <div class="idea-text">${escapeHtml(i.text)}</div>
          <div class="idea-foot">
            <span class="meta">${new Date(i.created_at).toLocaleString('ru-RU')}</span>
            <button class="like-btn ${isLiked ? 'liked' : ''}"
                    onclick="likeIdea(${i.id})"
                    ${isLiked ? 'disabled' : ''}>
              👍 <span>${i.likes}</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function likeIdea(id) {
    const liked = getLiked();
    if (liked.includes(id)) return;

    const res = await fetch(`/api/ideas/${id}/like`, { method: 'POST' });
    if (!res.ok) return;

    liked.push(id);
    setLiked(liked);
    loadIdeas();
  }

  async function sendIdea() {
    const text = input.value.trim();
    if (!text) { status.textContent = 'Напишите что-нибудь.'; return; }
    btn.disabled = true; status.textContent = 'Отправка...';

    const res = await fetch('/api/ideas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, tag: selectedTag })
    });

    btn.disabled = false;
    if (!res.ok) { status.textContent = 'Ошибка'; return; }

    input.value = '';
    status.textContent = 'Отправлено ✅';
    setTimeout(() => status.textContent = '', 2000);
    loadIdeas();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  loadIdeas();
  setInterval(loadIdeas, 15000);
</script>
</body>
</html>
