<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoVault — сервис анонимных идей для EasyMerch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1a1a1a;
    padding: 32px 20px 60px;
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* === СМЕНЯЮЩИЕСЯ ФОНЫ === */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 2.5s ease-in-out;
    z-index: -2;
  }
  .bg-layer.active { opacity: 1; }

  /* Полупрозрачная плёнка поверх фона для читаемости */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(245, 247, 250, 0.78) 0%,
      rgba(245, 247, 250, 0.88) 60%,
      rgba(245, 247, 250, 0.95) 100%
    );
    z-index: -1;
    backdrop-filter: blur(2px);
  }

  /* === ЗАГОЛОВОК === */
  header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.8s ease-out;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f5576c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.05;
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 12px rgba(102, 126, 234, 0.25));
  }

  .subtitle-header {
    font-size: clamp(0.85rem, 2.2vw, 1rem);
    color: #4a5568;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  .subtitle-header strong {
    color: #667eea;
    font-weight: 700;
  }

  /* === СТЕКЛЯННЫЕ КАРТОЧКИ === */
  .card, .idea, .filters {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    box-shadow:
      0 8px 32px rgba(31, 38, 135, 0.12),
      0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .card {
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === ПОЛЕ ВВОДА === */
  textarea {
    width: 100%;
    min-height: 110px;
    padding: 16px 18px;
    border: 2px solid rgba(102, 126, 234, 0.15);
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
    background: rgba(255, 255, 255, 0.7);
    transition: all 0.25s ease;
    color: #1a1a1a;
  }
  textarea::placeholder { color: #94a3b8; }
  textarea:focus {
    outline: none;
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
  }

  /* === ТЕГИ ПРИ ОТПРАВКЕ === */
  .tags-row {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;
  }

  .tag-btn {
    padding: 9px 18px;
    border-radius: 24px;
    border: 2px solid rgba(102, 126, 234, 0.18);
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    color: #4a5568;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: inherit;
  }
  .tag-btn:hover {
    border-color: #667eea;
    color: #667eea;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.18);
  }
  .tag-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
  }

  /* === ГЛАВНАЯ КНОПКА === */
  button.send {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    padding: 16px 32px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    letter-spacing: 0.02em;
    transition: all 0.25s ease;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  button.send:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(102, 126, 234, 0.5);
  }
  button.send:active:not(:disabled) {
    transform: translateY(0);
  }
  button.send:disabled {
    background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
    cursor: not-allowed;
    box-shadow: none;
  }

  .status {
    font-size: 0.88rem; color: #4a5568; margin-top: 10px;
    text-align: center; min-height: 20px; font-weight: 500;
  }

  /* === ФИЛЬТРЫ === */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 10px; margin-bottom: 20px;
  }
  .filters button {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    color: #4a5568;
    transition: all 0.22s ease;
    font-family: inherit;
  }
  .filters button:hover {
    background: rgba(102, 126, 234, 0.12);
    color: #667eea;
  }
  .filters button.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
  }

  /* === КАРТОЧКА ИДЕИ === */
  .idea {
    padding: 20px 22px;
    margin-bottom: 14px;
    animation: fadeUp 0.5s ease-out;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .idea:hover {
    transform: translateY(-3px);
    box-shadow:
      0 14px 40px rgba(31, 38, 135, 0.16),
      0 4px 12px rgba(0, 0, 0, 0.06);
  }

  .idea-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }

  .badge {
    font-size: 0.72rem; padding: 5px 12px; border-radius: 14px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge.idea {
    background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
    color: #3730a3;
  }
  .badge.problem {
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    color: #991b1b;
  }
  .badge.question {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    color: #92400e;
  }
  .badge.other {
    background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
    color: #374151;
  }

  .idea-text {
    font-size: 1.02rem; line-height: 1.6; color: #1a1a1a;
    white-space: pre-wrap; word-wrap: break-word;
  }

  .idea-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(102, 126, 234, 0.1);
  }

  .meta { color: #94a3b8; font-size: 0.8rem; font-weight: 500; }

  .like-btn {
    background: rgba(102, 126, 234, 0.1);
    border: 2px solid transparent;
    padding: 8px 16px;
    border-radius: 22px;
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 700;
    color: #667eea;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: inherit;
  }
  .like-btn:hover:not(:disabled) {
    background: rgba(102, 126, 234, 0.18);
    transform: translateY(-2px) scale(1.04);
  }
  .like-btn.liked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    cursor: default;
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
  }
  .like-btn.liked:hover {
    transform: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .empty {
    text-align: center; color: #64748b; padding: 60px 20px;
    font-size: 1rem; font-weight: 500;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  /* === МОБИЛЬНАЯ АДАПТАЦИЯ === */
  @media (max-width: 600px) {
    body { padding: 20px 14px 40px; }
    .card { padding: 18px; border-radius: 18px; }
    .idea { padding: 16px 18px; }
    .filters { padding: 8px; }
    .filters button { padding: 7px 12px; font-size: 0.82rem; }
    .tag-btn { padding: 8px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">EchoVault</div>
  <div class="subtitle-header">
    сервис анонимных идей и предложений для <strong>EasyMerch</strong>
  </div>
</header>

<div class="card">
  <textarea id="ideaInput" placeholder="Поделитесь идеей, проблемой или вопросом..."></textarea>
  <div class="tags-row" id="tagRow">
    <button class="tag-btn active" data-tag="idea">💡 Идея</button>
    <button class="tag-btn" data-tag="problem">⚠️ Проблема</button>
    <button class="tag-btn" data-tag="question">❓ Вопрос</button>
    <button class="tag-btn" data-tag="other">💬 Другое</button>
  </div>
  <button class="send" id="sendBtn" onclick="sendIdea()">Отправить анонимно</button>
  <div class="status" id="status"></div>
</div>

<div class="filters" id="filters">
  <button class="active" data-filter="">Все</button>
  <button data-filter="idea">💡 Идеи</button>
  <button data-filter="problem">⚠️ Проблемы</button>
  <button data-filter="question">❓ Вопросы</button>
  <button data-filter="other">💬 Другое</button>
</div>

<div id="ideasList"></div>

<script>
  // === СМЕНА ФОНОВ ===
  const BACKGROUNDS = [
    'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80', // горы
    'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80', // озеро и горы
    'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80', // лес
    'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80', // туманный лес
    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80', // пляж
    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1920&q=80'  // поле
  ];

  const bgLayers = [];
  let currentBg = 0;

  BACKGROUNDS.forEach((url, i) => {
    const layer = document.createElement('div');
    layer.className = 'bg-layer' + (i === 0 ? ' active' : '');
    layer.style.backgroundImage = `url('${url}')`;
    document.body.appendChild(layer);
    bgLayers.push(layer);
  });

  setInterval(() => {
    bgLayers[currentBg].classList.remove('active');
    currentBg = (currentBg + 1) % bgLayers.length;
    bgLayers[currentBg].classList.add('active');
  }, 12000);

  // === ЛОГИКА ===
  const input = document.getElementById('ideaInput');
  const btn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const list = document.getElementById('ideasList');
  const filters = document.getElementById('filters');

  let selectedTag = 'idea';
  let currentFilter = '';

  const TAG_LABELS = {
    idea: '💡 Идея',
    problem: '⚠️ Проблема',
    question: '❓ Вопрос',
    other: '💬 Другое'
  };

  document.getElementById('tagRow').addEventListener('click', e => {
    if (!e.target.classList.contains('tag-btn')) return;
    document.querySelectorAll('#tagRow .tag-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedTag = e.target.dataset.tag;
  });

  filters.addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    loadIdeas();
  });

  function getLiked() {
    try { return JSON.parse(localStorage.getItem('liked') || '[]'); }
    catch { return []; }
  }
  function setLiked(arr) { localStorage.setItem('liked', JSON.stringify(arr)); }

  async function loadIdeas() {
    const url = currentFilter ? `/api/ideas?tag=${currentFilter}` : '/api/ideas';
    const res = await fetch(url);
    const data = await res.json();

    if (!data.length) {
      list.innerHTML = '<div class="empty">Пока идей нет. Будьте первым!</div>';
      return;
    }

    const liked = getLiked();

    list.innerHTML = data.map(i => {
      const isLiked = liked.includes(i.id);
      return `
        <div class="idea">
          <div class="idea-head">
            <span class="badge ${i.tag}">${TAG_LABELS[i.tag] || i.tag}</span>
          </div>
          <div class="idea-text">${escapeHtml(i.text)}</div>
          <div class="idea-foot">
            <span class="meta">${new Date(i.created_at).toLocaleString('ru-RU')}</span>
            <button class="like-btn ${isLiked ? 'liked' : ''}"
                    onclick="likeIdea(${i.id})"
                    ${isLiked ? 'disabled' : ''}>
              👍 <span>${i.likes}</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function likeIdea(id) {
    const liked = getLiked();
    if (liked.includes(id)) return;
    const res = await fetch(`/api/ideas/${id}/like`, { method: 'POST' });
    if (!res.ok) return;
    liked.push(id);
    setLiked(liked);
    loadIdeas();
  }

  async function sendIdea() {
    const text = input.value.trim();
    if (!text) { status.textContent = 'Напишите что-нибудь.'; return; }
    btn.disabled = true; status.textContent = 'Отправка...';

    const res = await fetch('/api/ideas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, tag: selectedTag })
    });

    btn.disabled = false;
    if (!res.ok) { status.textContent = 'Ошибка'; return; }

    input.value = '';
    status.textContent = 'Отправлено ✅';
    setTimeout(() => status.textContent = '', 2000);
    loadIdeas();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  loadIdeas();
  setInterval(loadIdeas, 15000);
</script>
</body>
</html>
