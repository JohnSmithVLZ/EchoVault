<style>

  /* === ЗАГОЛОВОК === */
  header {

  .logo {

  .filters button:hover { background: rgba(165, 180, 252, 0.15); color: #fff; }
  .filters button.active {

  /* === СЕТКА === */

  .idea {

      0 0 0 1px rgba(165, 180, 252, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .idea.resolved {
    opacity: 0.72;
    border-color: rgba(34, 197, 94, 0.4);
    background: rgba(20, 45, 30, 0.55);
  }
  .idea.resolved .idea-text {

    color: #a7f3d0;
  }
  .idea.resolved::after {

    top: -10px;
    right: 16px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);

    font-weight: 800;

    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(34, 197, 94, 0.5);

  .idea-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.72rem; padding: 5px 12px; border-radius: 14px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge.idea { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: #e0e7ff; }
  .badge.problem { background: linear-gradient(135deg, #dc2626 0%, #f43f5e 100%); color: #fee2e2; }
  .badge.question { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); color: #fef3c7; }
  .badge.other { background: linear-gradient(135deg, #475569 0%, #64748b 100%); color: #e2e8f0; }

  .idea-text {

  .idea-foot {

  .meta { color: #94a3b8; font-size: 0.78rem; font-weight: 500; }

  .like-btn {
    background: rgba(165, 180, 252, 0.12);
    border: 2px solid transparent;
    padding: 8px 16px; border-radius: 22px;
    cursor: pointer; font-size: 0.92rem; font-weight: 700;
    color: #c7d2fe;
    display: flex; align-items: center; gap: 6px;

    font-family: inherit;
  }
  .like-btn:hover:not(:disabled) {
    background: rgba(165, 180, 252, 0.22);
    transform: translateY(-2px) scale(1.05);
  }
  .like-btn.liked {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #fff; cursor: default;
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
  }
  .like-btn.liked:hover { transform: none; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }

  /* === АДМИН-КНОПКИ === */
  .admin-actions {
    display: flex; gap: 8px; margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed rgba(245, 158, 11, 0.3);
  }
  .admin-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 12px;
    border: 2px solid transparent;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.22s ease;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .admin-btn.resolve {
    background: rgba(34, 197, 94, 0.15);
    color: #86efac;
    border-color: rgba(34, 197, 94, 0.3);
  }
  .admin-btn.resolve:hover { background: rgba(34, 197, 94, 0.3); transform: translateY(-2px); }
  .admin-btn.unresolve {
    background: rgba(148, 163, 184, 0.15);
    color: #cbd5e1;
    border-color: rgba(148, 163, 184, 0.3);
  }
  .admin-btn.unresolve:hover { background: rgba(148, 163, 184, 0.3); transform: translateY(-2px); }
  .admin-btn.delete {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.3);
  }
  .admin-btn.delete:hover { background: rgba(239, 68, 68, 0.3); transform: translateY(-2px); }

  .empty {
    grid-column: 1 / -1;
    text-align: center; color: #c7d2fe; padding: 60px 20px;
    font-size: 1rem; font-weight: 500;
    background: rgba(20, 22, 45, 0.5);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(165, 180, 252, 0.18);
  }

  /* === ФОРМА ВНИЗУ === */
  .composer {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 1060px;
    padding: 18px 22px; z-index: 100;
    box-shadow:
      0 -8px 40px rgba(0, 0, 0, 0.5),
      0 8px 32px rgba(99, 102, 241, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  textarea {
    width: 100%; min-height: 60px; max-height: 180px;
    padding: 14px 18px;
    border: 2px solid rgba(165, 180, 252, 0.2);
    border-radius: 14px;
    font-family: inherit; font-size: 1rem; line-height: 1.5;
    resize: none;
    background: rgba(10, 12, 30, 0.6);
    transition: all 0.25s ease; color: #e8eaf6;
  }
  textarea::placeholder { color: #818cf8; }
  textarea:focus {
    outline: none; border-color: #a5b4fc;
    background: rgba(10, 12, 30, 0.85);
    box-shadow: 0 0 0 4px rgba(165, 180, 252, 0.15);

  .composer-row {

  }
  .tags-row { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .tag-btn {
    padding: 8px 16px; border-radius: 22px;
    border: 2px solid rgba(165, 180, 252, 0.2);
    background: rgba(10, 12, 30, 0.5);
    cursor: pointer; font-size: 0.85rem; font-weight: 600;
    color: #c7d2fe;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: inherit; white-space: nowrap;
  }
  .tag-btn:hover { border-color: #a5b4fc; color: #fff; transform: translateY(-2px); }
  .tag-btn.active {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
  }

  button.send {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);

    padding: 12px 28px; border-radius: 14px;

  button.send:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(139, 92, 246, 0.6);
  }
  button.send:disabled {
    background: linear-gradient(135deg, #475569 0%, #64748b 100%);
    cursor: not-allowed; box-shadow: none;
  }

  .status {
    font-size: 0.85rem; color: #c7d2fe; margin-top: 8px;
    text-align: center; min-height: 18px; font-weight: 500;
  }

  /* === КОТИК === */
  .kitty {
    position: fixed;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    z-index: 150;
    user-select: none;
    text-decoration: none;
    transition: transform 0.2s ease;
    animation: kittyPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: auto;
    opacity: 0.9;
  }
  .kitty:hover { transform: scale(1.4) rotate(-8deg); opacity: 1; }
  .kitty.leaving { animation: kittyLeave 0.5s ease-in forwards; }

  @keyframes kittyPop {
    from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
    to { opacity: 0.9; transform: scale(1) rotate(0); }
  }
  @keyframes kittyLeave {
    from { opacity: 0.9; transform: scale(1) rotate(0); }
    to { opacity: 0; transform: scale(0.3) rotate(20deg); }
  }

  /* === МОДАЛЬНОЕ ОКНО С ИГРОЙ === */
  .game-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: overlayIn 0.3s ease-out;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .game-overlay.hidden { display: none; }

  .game-frame-wrapper {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 90vh;
    max-height: 900px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 20px 80px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(165, 180, 252, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: frameIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes frameIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .game-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #1a0e08;
  }

  .game-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(20, 22, 45, 0.85);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(165, 180, 252, 0.4);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.22s ease;
    font-family: inherit;
    z-index: 10;
  }
  .game-close:hover {
    background: rgba(220, 38, 38, 0.9);
    border-color: transparent;
    transform: scale(1.1) rotate(90deg);
  }

  .game-title {
    position: absolute;
    top: 16px;
    left: 16px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.9) 0%, rgba(168, 85, 247, 0.9) 100%);
    color: #fff;
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 10;
    pointer-events: none;
  }

  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .app { padding: 20px 14px 300px; }
    .composer {
      width: calc(100% - 20px); bottom: 10px;
      padding: 14px; max-height: 45vh; overflow-y: auto;
    }
    .composer-row { flex-direction: column; align-items: stretch; }

    .top-bar { top: 10px; right: 10px; flex-direction: column; align-items: flex-end; gap: 6px; }
    .role-badge, .logout-btn { font-size: 0.75rem; padding: 6px 12px; }
    .kitty { font-size: 16px; }
    .game-frame-wrapper { height: 85vh; border-radius: 16px; }
    .game-close { width: 36px; height: 36px; font-size: 18px; top: 8px; right: 8px; }
    .game-title { font-size: 0.75rem; padding: 6px 12px; top: 8px; left: 8px; }
  }

<!-- === ЭКРАН ВХОДА === -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">EchoVault</div>
    <div class="login-subtitle">сервис анонимных идей и предложений для <strong>EasyMerch</strong></div>
    <label class="login-label" for="passwordInput">Пароль</label>
    <input
      type="password"
      id="passwordInput"
      class="login-input"
      placeholder="Введите пароль"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()"
    >
    <button class="login-btn" id="loginBtn" onclick="login()">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- === ОСНОВНОЙ ИНТЕРФЕЙС === -->
<div id="mainScreen" class="hidden">
  <div class="top-bar">
    <div class="role-badge" id="roleBadge"></div>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <div class="app">
    <header>
      <div class="logo">EchoVault</div>
      <div class="subtitle-header">
        сервис анонимных идей и предложений для <strong>EasyMerch</strong>
      </div>
    </header>

    <div class="filters" id="filters">
      <button class="active" data-filter="">Все</button>
      <button data-filter="idea">💡 Идеи</button>
      <button data-filter="problem">⚠️ Проблемы</button>
      <button data-filter="question">❓ Вопросы</button>
      <button data-filter="other">💬 Другое</button>
      <button data-filter="resolved" class="resolved-filter">✅ Решённые</button>
    </div>

    <div id="ideasList"></div>
  </div>

  <div class="composer">
    <textarea id="ideaInput" placeholder="Поделитесь идеей, проблемой или вопросом..."></textarea>
    <div class="composer-row">
      <div class="tags-row" id="tagRow">
        <button class="tag-btn active" data-tag="idea">💡 Идея</button>
        <button class="tag-btn" data-tag="problem">⚠️ Проблема</button>
        <button class="tag-btn" data-tag="question">❓ Вопрос</button>
        <button class="tag-btn" data-tag="other">💬 Другое</button>
      </div>
      <button class="send" id="sendBtn" onclick="sendIdea()">Отправить</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- === МОДАЛЬНОЕ ОКНО С ИГРОЙ === -->
<div class="game-overlay hidden" id="gameOverlay">
  <div class="game-frame-wrapper">
    <div class="game-title">🐱 Мастер Чебупель</div>
    <button class="game-close" onclick="closeGame()" title="Закрыть">×</button>
    <iframe class="game-frame" id="gameFrame" src="about:blank" title="Мастер Чебупель"></iframe>
  </div>
</div>

<script>
  // === ЗВЁЗДЫ ===
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    star.style.animationDelay = (Math.random() * 4) + 's';
    document.body.appendChild(star);
  }

  // === СОСТОЯНИЕ ===
  let token = localStorage.getItem('token') || null;
  let role = localStorage.getItem('role') || null;
  let selectedTag = 'idea';
  let currentFilter = '';

  const TAG_LABELS = {
    idea: '💡 Идея',
    problem: '⚠️ Проблема',
    question: '❓ Вопрос',
    other: '💬 Другое'
  };

  const loginScreen = document.getElementById('loginScreen');
  const mainScreen = document.getElementById('mainScreen');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const roleBadge = document.getElementById('roleBadge');
  const input = document.getElementById('ideaInput');
  const btn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const list = document.getElementById('ideasList');
  const filters = document.getElementById('filters');
  const gameOverlay = document.getElementById('gameOverlay');
  const gameFrame = document.getElementById('gameFrame');

  // === API-ХЕЛПЕР ===
  async function api(url, options = {}) {
    options.headers = options.headers || {};
    if (token) options.headers['Authorization'] = token;
    if (options.body && !options.headers['Content-Type']) {
      options.headers['Content-Type'] = 'application/json';
    }
    const res = await fetch(url, options);
    if (res.status === 401) {
      doLocalLogout();
      throw new Error('Требуется вход');
    }
    return res;
  }

  // === ВХОД ===
  async function login() {
    const password = passwordInput.value.trim();
    if (!password) { loginError.textContent = 'Введите пароль'; return; }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Вход...';
    loginError.textContent = '';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (!res.ok) {
        loginError.textContent = data.error || 'Неверный пароль';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
        return;
      }

      token = data.token;
      role = data.role;
      localStorage.setItem('token', token);
      localStorage.setItem('role', role);
      passwordInput.value = '';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Войти';

      showMain();
      loadIdeas();
    } catch (err) {
      loginError.textContent = 'Ошибка соединения';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Войти';
    }
  }

  // === ВЫХОД ===
  async function logout() {
    try {
      await api('/api/logout', { method: 'POST' });
    } catch (e) {}
    doLocalLogout();
  }

  function doLocalLogout() {
    token = null;
    role = null;
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    mainScreen.classList.add('hidden');
    loginScreen.style.display = 'flex';
    passwordInput.value = '';
    loginError.textContent = '';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Войти';
    closeGame();
  }

  // === ПОКАЗ ОСНОВНОГО ЭКРАНА ===
  function showMain() {
    loginScreen.style.display = 'none';
    mainScreen.classList.remove('hidden');

    if (role === 'admin') {
      roleBadge.className = 'role-badge admin';
      roleBadge.textContent = '👑 Администратор';
    } else {
      roleBadge.className = 'role-badge user';
      roleBadge.textContent = '👤 Пользователь';
    }
  }

  // === ТЕГИ ===
  document.getElementById('tagRow').addEventListener('click', e => {
    if (!e.target.classList.contains('tag-btn')) return;
    document.querySelectorAll('#tagRow .tag-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedTag = e.target.dataset.tag;
  });

  // === ФИЛЬТРЫ ===
  filters.addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    loadIdeas();
  });

  // === ЛАЙКИ (localStorage) ===
  function getLiked() {
    try { return JSON.parse(localStorage.getItem('liked') || '[]'); }
    catch { return []; }
  }
  function setLiked(arr) { localStorage.setItem('liked', JSON.stringify(arr)); }

  // === РЕНДЕР КАРТОЧКИ ===
  function renderIdea(i) {
    const liked = getLiked();
    const isLiked = liked.includes(i.id);
    const isResolved = !!i.resolved;
    const isAdmin = role === 'admin';

    return `
      <div class="idea ${isResolved ? 'resolved' : ''}" data-id="${i.id}">
        <div class="idea-head">
          <span class="badge ${i.tag}">${TAG_LABELS[i.tag] || i.tag}</span>
        </div>
        <div class="idea-text">${escapeHtml(i.text)}</div>
        <div class="idea-foot">
          <span class="meta">${new Date(i.created_at).toLocaleString('ru-RU')}</span>
          <button class="like-btn ${isLiked ? 'liked' : ''}"
                  onclick="likeIdea(${i.id})"
                  ${isLiked ? 'disabled' : ''}>
            👍 <span>${i.likes}</span>
          </button>
        </div>
        ${isAdmin ? `
          <div class="admin-actions">
            ${isResolved
              ? `<button class="admin-btn unresolve" onclick="resolveIdea(${i.id}, false)">↩️ Вернуть</button>`
              : `<button class="admin-btn resolve" onclick="resolveIdea(${i.id}, true)">✓ Решено</button>`}
            <button class="admin-btn delete" onclick="deleteIdea(${i.id})">🗑 Удалить</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  // === ЗАГРУЗКА ИДЕЙ ===
  async function loadIdeas() {
    try {
      let url = '/api/ideas';
      if (currentFilter === 'resolved') {
        url = '/api/ideas?resolved=true';
      } else if (currentFilter) {
        url = `/api/ideas?tag=${currentFilter}`;
      }

      const res = await api(url);
      const data = await res.json();

      if (!data.length) {
        let emptyMsg = 'Пока идей нет. Будьте первым! ✨';
        if (currentFilter === 'resolved') emptyMsg = 'Решённых идей пока нет.';
        list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
        return;
      }

      list.innerHTML = data.map(i => renderIdea(i)).join('');
    } catch (err) {
      // если 401 — уже разлогинило
    }
  }

  // === ЛАЙК ===
  async function likeIdea(id) {
    const liked = getLiked();
    if (liked.includes(id)) return;

    try {
      const res = await api(`/api/ideas/${id}/like`, { method: 'POST' });
      if (!res.ok) return;
      liked.push(id);
      setLiked(liked);
      loadIdeas();
    } catch (e) {}
  }

  // === ОТПРАВКА ===
  async function sendIdea() {
    const text = input.value.trim();
    if (!text) { status.textContent = 'Напишите что-нибудь.'; return; }
    btn.disabled = true; status.textContent = 'Отправка...';

    try {
      const res = await api('/api/ideas', {
        method: 'POST',
        body: JSON.stringify({ text, tag: selectedTag })
      });

      btn.disabled = false;
      if (!res.ok) { status.textContent = 'Ошибка'; return; }

      input.value = '';
      status.textContent = 'Отправлено ✅';
      setTimeout(() => status.textContent = '', 2000);
      loadIdeas();
    } catch (e) {
      btn.disabled = false;
      status.textContent = 'Ошибка';
    }
  }

  // === РЕШЕНО (АДМИН) ===
  async function resolveIdea(id, resolved) {
    try {
      const res = await api(`/api/ideas/${id}/resolve`, {
        method: 'POST',
        body: JSON.stringify({ resolved })
      });
      if (res.ok) loadIdeas();
    } catch (e) {}
  }

  // === УДАЛИТЬ (АДМИН) ===
  async function deleteIdea(id) {
    if (!confirm('Удалить эту идею? Это действие необратимо.')) return;
    try {
      const res = await api(`/api/ideas/${id}`, { method: 'DELETE' });
      if (res.ok) loadIdeas();
    } catch (e) {}
  }

  // === ЭКРАНИРОВАНИЕ ===
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // === ОТКРЫТИЕ / ЗАКРЫТИЕ ИГРЫ ===
  function openGame() {
    // Загружаем игру только при открытии (чтобы не тормозить страницу)
    if (gameFrame.src === 'about:blank' || !gameFrame.src.endsWith('/game.html')) {
      gameFrame.src = '/game.html';
    }
    gameOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeGame() {
    gameOverlay.classList.add('hidden');
    document.body.style.overflow = '';
  }

  // Закрытие по клику на фон
  gameOverlay.addEventListener('click', e => {
    if (e.target === gameOverlay) closeGame();
  });

  // Закрытие по Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !gameOverlay.classList.contains('hidden')) {
      closeGame();
    }
  });

  // === КОТИК ===
  const KITTY_EMOJIS = ['😺', '😸', '😻'];
  let kittyTimeout = null;

  function findSafePosition() {
    const KITTY_SIZE = 24;
    const EDGE_WIDTH = 70;
    const TOP_SAFE = 90;
    const BOTTOM_SAFE = 280;

    const viewportH = window.innerHeight;
    const viewportW = window.innerWidth;

    for (let attempt = 0; attempt < 20; attempt++) {
      const side = Math.random() < 0.5 ? 'left' : 'right';
      let x;
      if (side === 'left') {
        x = 10 + Math.random() * (EDGE_WIDTH - KITTY_SIZE - 10);
      } else {
        x = viewportW - EDGE_WIDTH + Math.random() * (EDGE_WIDTH - KITTY_SIZE - 10);
      }

      const safeTop = TOP_SAFE;
      const safeBottom = viewportH - BOTTOM_SAFE;
      if (safeBottom <= safeTop) continue;

      const y = safeTop + Math.random() * (safeBottom - safeTop);

      const el = document.elementFromPoint(x + KITTY_SIZE / 2, y + KITTY_SIZE / 2);
      if (!el) continue;

      if (el === document.body || el === document.documentElement) {
        return { x, y };
      }

      if (el.closest('button, input, textarea, a, .idea, .composer, .filters, .top-bar, .login-card, .game-overlay')) {
        continue;
      }

      return { x, y };
    }

    return null;
  }

  function spawnKitty() {
    if (mainScreen.classList.contains('hidden')) {
      scheduleKitty();
      return;
    }

    // Не показываем котика, если открыта игра
    if (!gameOverlay.classList.contains('hidden')) {
      scheduleKitty();
      return;
    }

    document.querySelectorAll('.kitty').forEach(el => el.remove());

    const pos = findSafePosition();
    if (!pos) {
      scheduleKitty();
      return;
    }

    const kitty = document.createElement('div');
    kitty.className = 'kitty';
    kitty.textContent = KITTY_EMOJIS[Math.floor(Math.random() * KITTY_EMOJIS.length)];
    kitty.title = 'Мяу! Нажми на меня 🐾';
    kitty.style.left = pos.x + 'px';
    kitty.style.top = pos.y + 'px';

    kitty.addEventListener('click', () => {
      kitty.classList.add('leaving');
      setTimeout(() => kitty.remove(), 500);
      openGame();
    });

    document.body.appendChild(kitty);

    setTimeout(() => {
      if (kitty.isConnected) {
        kitty.classList.add('leaving');
        setTimeout(() => kitty.remove(), 500);
      }
    }, 5000);

    scheduleKitty();
  }

  function scheduleKitty() {
    if (kittyTimeout) clearTimeout(kittyTimeout);
    const delay = 7000 + Math.random() * 8000;
    kittyTimeout = setTimeout(spawnKitty, delay);
  }

  scheduleKitty();

  // === СТАРТ ===
  if (token && role) {
    (async () => {
      try {
        const res = await fetch('/api/ideas', {
          headers: { 'Authorization': token }
        });
        if (res.ok) {
          showMain();
          loadIdeas();
        } else {
          doLocalLogout();
        }
      } catch {
        doLocalLogout();
      }
    })();
  } else {
    doLocalLogout();
  }
</script>
</body>
</html>
