<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мастер Чебупель</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #2a1a0e 0%, #1a0e08 100%);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #game {
    display: block;
    border: 5px solid #c88a3a;
    border-radius: 16px;
    box-shadow: 0 0 60px rgba(255, 180, 80, 0.6), 0 0 120px rgba(255, 120, 40, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
    cursor: pointer;
    max-width: 95vw;
    max-height: 95vh;
  }
</style>
</head>
<body>
<canvas id="game" width="560" height="780"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;

  const W = canvas.width;
  const H = canvas.height;

  const VW = 140;
  const VH = 195;

  // ---------- Лёгкий темп ----------
  const GRAVITY = 0.16;
  const JUMP = -3.6;
  const PIPE_W = 18;
  const PIPE_GAP_BASE = 62;
  const PIPE_GAP_BONUS = 80;
  const PIPE_SPEED = 0.75;
  const SPAWN_INTERVAL = 160;
  const GROUND_H = 20;
  const MAX_FALL = 3.2;

  // ---------- Фоны с Unsplash ----------
  const BG_IMAGES = [
    'https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1585325701953-1bf0b7b8e0ea?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800&q=80&fit=crop',
    'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=800&q=80&fit=crop'
  ];

  let bgIndex = 0;
  let bgPrevIndex = 0;
  let bgTransition = 1;

  const bgImages = [];
  let bgLoaded = 0;
  BG_IMAGES.forEach((src, i) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { bgLoaded++; };
    img.onerror = () => { console.warn('Не удалось загрузить фон:', src); };
    img.src = src;
    bgImages.push(img);
  });

  let state, bird, pipes, frames, score, best, spawnTimer,
      bonusActive, bonusTimer, particles, sparks, floatTexts,
      caramelSplash;

  best = +(localStorage.getItem('chebupel_best') || 0);

  function reset(keepBg = true) {
    state = 'ready';
    bird = {
      x: 32, y: VH / 2, vy: 0,
      w: 11, h: 9, rot: 0, wingPhase: 0,
      blinkTimer: 0, blinking: false
    };
    pipes = [];
    frames = 0;
    score = 0;
    spawnTimer = 0;
    bonusActive = false;
    bonusTimer = 0;
    particles = [];
    sparks = [];
    floatTexts = [];
    caramelSplash = [];
    if (!keepBg) { bgPrevIndex = 0; bgIndex = 0; bgTransition = 1; }
  }
  reset(false);

  // ---------- Управление ----------
  function flap() {
    if (state === 'ready') {
      state = 'play';
      bird.vy = JUMP;
      sparksBurst(6);
    } else if (state === 'play') {
      bird.vy = JUMP;
      sparksBurst(4);
    } else if (state === 'dead') {
      if (frames > 25) {
        const newIdx = Math.floor(Math.random() * BG_IMAGES.length);
        if (newIdx !== bgIndex) {
          bgPrevIndex = bgIndex;
          bgIndex = newIdx;
          bgTransition = 0;
        }
        reset(true);
      }
    }
  }

  function sparksBurst(n) {
    for (let i = 0; i < n; i++) {
      sparks.push({
        x: bird.x - 4, y: bird.y + 2,
        vx: -0.8 - Math.random() * 1.2,
        vy: (Math.random() - 0.5) * 1.4,
        life: 12 + Math.random() * 10,
        maxLife: 22
      });
    }
  }

  canvas.addEventListener('mousedown', e => { e.preventDefault(); flap(); });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault(); flap();
    }
  });

  // ---------- Спавн ----------
  function spawnPipe() {
    const gap = bonusActive ? PIPE_GAP_BONUS : PIPE_GAP_BASE;
    const margin = 14;
    const minTop = margin + 10;
    const maxTop = VH - GROUND_H - gap - margin - 10;
    const topH = Math.floor(minTop + Math.random() * (maxTop - minTop));

    const hasBonus = Math.random() < 0.45;
    const bonusY = topH + gap / 2;
    const bonusType = Math.floor(Math.random() * 4);

    // Случайный тип «трубы»-еды
    const pipeTypes = ['pelmen', 'cheburek', 'sausage', 'sushi', 'donut'];
    const pipeType = pipeTypes[Math.floor(Math.random() * pipeTypes.length)];

    pipes.push({
      x: VW + 4, topH, gap, passed: false,
      hasBonus, bonusTaken: false, bonusY,
      bonusPhase: Math.random() * Math.PI * 2,
      bonusType,
      pipeType
    });
  }

  // ---------- Обновление ----------
  function update() {
    frames++;
    if (bgTransition < 1) bgTransition = Math.min(1, bgTransition + 0.02);

    bird.blinkTimer++;
    if (bird.blinkTimer > 180 + Math.random() * 120) {
      bird.blinking = true;
      if (bird.blinkTimer > 200 + Math.random() * 120) {
        bird.blinking = false;
        bird.blinkTimer = 0;
      }
    }

    if (bonusTimer > 0) {
      bonusTimer--;
      if (bonusTimer === 0) bonusActive = false;
    }

    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
      return p.life > 0;
    });
    sparks = sparks.filter(s => {
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.96; s.life--;
      return s.life > 0;
    });
    floatTexts = floatTexts.filter(t => {
      t.y -= 0.5; t.life--;
      return t.life > 0;
    });
    caramelSplash = caramelSplash.filter(s => {
      s.x += s.vx; s.y += s.vy; s.vy += 0.15; s.life--;
      return s.life > 0;
    });

    if (state === 'ready') {
      bird.y = VH / 2 + Math.sin(frames / 18) * 2.5;
      bird.wingPhase += 0.18;
      return;
    }

    if (state === 'dead') {
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      if (bird.y > VH - GROUND_H - bird.h / 2) {
        bird.y = VH - GROUND_H - bird.h / 2;
        if (bird.vy > 1) {
          for (let i = 0; i < 8; i++) {
            caramelSplash.push({
              x: bird.x + (Math.random() - 0.5) * 10,
              y: VH - GROUND_H,
              vx: (Math.random() - 0.5) * 4,
              vy: -2 - Math.random() * 3,
              life: 30 + Math.random() * 20,
              maxLife: 50,
              size: 1 + Math.random() * 2
            });
          }
          for (let i = 0; i < 4; i++) {
            sparks.push({
              x: bird.x, y: bird.y + 3,
              vx: (Math.random() - 0.5) * 3,
              vy: -Math.random() * 2,
              life: 10 + Math.random() * 10, maxLife: 20
            });
          }
        }
        bird.vy = 0;
      }
      bird.rot = Math.min(Math.PI / 2, bird.rot + 0.06);
      return;
    }

    // ---- PLAY ----
    bird.vy += GRAVITY;
    if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    if (bonusActive && bird.vy > 0) bird.vy *= 0.85;
    bird.y += bird.vy;
    bird.wingPhase += 0.28;

    const targetRot = Math.max(-0.35, Math.min(0.9, bird.vy * 0.14));
    bird.rot += (targetRot - bird.rot) * 0.18;

    spawnTimer++;
    if (spawnTimer >= SPAWN_INTERVAL) {
      spawnTimer = 0;
      spawnPipe();
    }

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      p.bonusPhase += 0.12;
    }

    const bx = bird.x, by = bird.y, bw = bird.w / 2 - 1, bh = bird.h / 2 - 1;

    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x - bw) {
        p.passed = true;
        score++;
        floatTexts.push({ x: VW / 2, y: 30, life: 40, text: '+1' });
        for (let i = 0; i < 6; i++) {
          sparks.push({
            x: bird.x + 5, y: bird.y + (Math.random() - 0.5) * 6,
            vx: -1 - Math.random() * 2,
            vy: (Math.random() - 0.5) * 1.5,
            life: 15 + Math.random() * 10, maxLife: 25
          });
        }
      }

      if (p.hasBonus && !p.bonusTaken) {
        const bxp = p.x + PIPE_W / 2;
        const byp = p.bonusY + Math.sin(p.bonusPhase) * 2;
        const dx = Math.abs(bxp - bird.x);
        const dy = Math.abs(byp - bird.y);
        if (dx < 9 && dy < 9) {
          p.bonusTaken = true;
          bonusActive = true;
          bonusTimer = 500;
          const colors = [
            ['#ffb84d', '#ff8c42', '#ffe066'],
            ['#a0d8ff', '#60a8e0', '#e0f4ff'],
            ['#ffffff', '#e8e8e8', '#c0e8ff'],
            ['#ff9060', '#e06040', '#ffc8a0']
          ][p.bonusType];
          for (let i = 0; i < 20; i++) {
            particles.push({
              x: bxp, y: byp,
              vx: (Math.random() - 0.5) * 2.5,
              vy: (Math.random() - 0.5) * 2.5 - 0.5,
              life: 30 + Math.random() * 20, maxLife: 50,
              color: colors[Math.floor(Math.random() * 3)]
            });
          }
          floatTexts.push({ x: bxp, y: byp - 6, life: 50, text: 'НЯМ!' });
        }
      }

      const px1 = p.x;
      const px2 = p.x + PIPE_W;
      const inX = bx + bw > px1 && bx - bw < px2;
      if (inX) {
        if (by - bh < p.topH) return die();
        if (by + bh > p.topH + p.gap) return die();
      }
    }

    if (bird.y - bh < 0) { bird.y = bh; bird.vy = 0; }
    if (bird.y + bh > VH - GROUND_H) {
      bird.y = VH - GROUND_H - bh;
      return die();
    }

    pipes = pipes.filter(p => p.x + PIPE_W > -10);
  }

  function die() {
    if (state !== 'play') return;
    state = 'dead';
    frames = 0;
    if (score > best) {
      best = score;
      localStorage.setItem('chebupel_best', best);
    }
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: bird.x, y: bird.y,
        vx: (Math.random() - 0.5) * 4.5,
        vy: (Math.random() - 0.5) * 4.5 - 1,
        life: 35 + Math.random() * 25, maxLife: 60,
        color: ['#ff6b6b', '#ffd93d', '#ffffff', '#ff9f43', '#ffe066'][Math.floor(Math.random() * 5)]
      });
    }
  }

  // ================= ОТРИСОВКА =================
  function draw() {
    const scaleX = W / VW;
    const scaleY = H / VH;
    ctx.save();
    ctx.scale(scaleX, scaleY);

    drawBackground();
    drawFloatingFood();
    drawMilkRiver();

    // Трубы-еда
    for (const p of pipes) drawFoodPipe(p);

    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.9;
      ctx.fillStyle = '#fff7c0';
      ctx.beginPath();
      ctx.arc(s.x, s.y, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of caramelSplash) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.9;
      ctx.fillStyle = '#fff8e8';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawCat(bird.x, bird.y, bird.rot, bird.wingPhase);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.life > 30 ? 1.2 : 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const t of floatTexts) {
      ctx.globalAlpha = Math.min(1, t.life / 25);
      ctx.font = 'bold 7px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#3a1a08';
      ctx.lineWidth = 1.8;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = '#ffe066';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    drawUI();
    ctx.restore();
  }

  // ---------- Фон ----------
  function drawBackground() {
    const curImg = bgImages[bgIndex];
    const prevImg = bgImages[bgPrevIndex];

    if (bgLoaded > 0 && prevImg && prevImg.complete && prevImg.naturalWidth > 0) {
      ctx.save();
      ctx.filter = 'blur(8px) brightness(0.95) saturate(1.15)';
      ctx.globalAlpha = 1 - bgTransition;
      drawImageCover(prevImg, -5, -5, VW + 10, VH + 10);
      ctx.globalAlpha = bgTransition;
      if (curImg && curImg.complete && curImg.naturalWidth > 0) {
        drawImageCover(curImg, -5, -5, VW + 10, VH + 10);
      }
      ctx.restore();

      const darkGrad = ctx.createLinearGradient(0, 0, 0, VH);
      darkGrad.addColorStop(0, 'rgba(40,15,5,0.15)');
      darkGrad.addColorStop(0.5, 'rgba(60,30,10,0.05)');
      darkGrad.addColorStop(1, 'rgba(40,15,5,0.3)');
      ctx.fillStyle = darkGrad;
      ctx.fillRect(0, 0, VW, VH);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, VH);
      g.addColorStop(0, '#fff4d8');
      g.addColorStop(0.5, '#f0d8a0');
      g.addColorStop(1, '#c89858');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, VW, VH);
    }
  }

  function drawImageCover(img, x, y, w, h) {
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const scale = Math.max(w / iw, h / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = x + (w - dw) / 2;
    const dy = y + (h - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  // ---------- Плавающая еда ----------
  function drawFloatingFood() {
    const scroll = (frames * 0.22) % 180;
    const items = [
      { x: 20,  y: 60, type: 'pelmen', size: 5 },
      { x: 80,  y: 48, type: 'cheburek', size: 4 },
      { x: 140, y: 65, type: 'sausage', size: 5 },
      { x: 200, y: 52, type: 'pizza', size: 4 },
      { x: 260, y: 62, type: 'donut', size: 5 }
    ];

    for (const it of items) {
      let ix = it.x - scroll;
      while (ix < -30) ix += 300;
      while (ix > VW + 30) ix -= 300;
      if (ix < -25 || ix > VW + 25) continue;

      ctx.globalAlpha = 0.4;
      drawFloatingIcon(ix, it.y, it.size, it.type);
      ctx.globalAlpha = 1;
    }
  }

  function drawFloatingIcon(x, y, s, icon) {
    if (icon === 'pelmen') {
      ctx.fillStyle = '#fff0c8';
      ctx.beginPath();
      ctx.arc(x, y, s, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#e0b878';
      for (let i = -s + 1; i < s - 1; i += 2) ctx.fillRect(x + i, y - 1, 1, 1);
    } else if (icon === 'cheburek') {
      ctx.fillStyle = '#f8d088';
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c88838';
      ctx.beginPath();
      ctx.ellipse(x, y + 1, s * 0.7, s * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (icon === 'sausage') {
      ctx.fillStyle = '#ffb090';
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c86048';
      ctx.fillRect(x - s, y - 1, 1, 2);
      ctx.fillRect(x + s - 1, y - 1, 1, 2);
    } else if (icon === 'pizza') {
      ctx.fillStyle = '#ffcc70';
      ctx.beginPath();
      ctx.moveTo(x, y - s);
      ctx.lineTo(x - s, y + s * 0.7);
      ctx.lineTo(x + s, y + s * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#c03020';
      ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
    } else if (icon === 'donut') {
      ctx.fillStyle = '#ffc0e0';
      ctx.beginPath();
      ctx.arc(x, y, s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a84888';
      ctx.beginPath();
      ctx.arc(x, y, s * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- МОЛОЧНАЯ РЕЧКА ----------
  function drawMilkRiver() {
    const gy = VH - GROUND_H;
    const t = frames * 0.05;

    const milkGrad = ctx.createLinearGradient(0, gy, 0, VH);
    milkGrad.addColorStop(0, '#fff8f0');
    milkGrad.addColorStop(0.3, '#fff0e0');
    milkGrad.addColorStop(0.6, '#f8e8d0');
    milkGrad.addColorStop(1, '#f0dcc0');
    ctx.fillStyle = milkGrad;
    ctx.fillRect(0, gy, VW, GROUND_H);

    // Волна 1 (главная)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, gy + 2);
    for (let x = 0; x <= VW; x += 2) {
      const wave = Math.sin(x * 0.15 + t * 1.2) * 1.2
                 + Math.sin(x * 0.3 + t * 0.8) * 0.6;
      ctx.lineTo(x, gy + 2 + wave);
    }
    ctx.lineTo(VW, gy + 8);
    ctx.lineTo(0, gy + 8);
    ctx.closePath();
    ctx.fill();

    // Волна 2
    ctx.fillStyle = 'rgba(255, 240, 220, 0.6)';
    ctx.beginPath();
    ctx.moveTo(0, gy + 6);
    for (let x = 0; x <= VW; x += 2) {
      const wave = Math.sin(x * 0.2 + t * 1.5) * 1.5
                 + Math.cos(x * 0.4 + t) * 0.7;
      ctx.lineTo(x, gy + 6 + wave);
    }
    ctx.lineTo(VW, gy + 12);
    ctx.lineTo(0, gy + 12);
    ctx.closePath();
    ctx.fill();

    // Волна 3
    ctx.fillStyle = 'rgba(255, 228, 200, 0.5)';
    ctx.beginPath();
    ctx.moveTo(0, gy + 10);
    for (let x = 0; x <= VW; x += 2) {
      const wave = Math.sin(x * 0.25 + t * 1.8) * 1.8;
      ctx.lineTo(x, gy + 10 + wave);
    }
    ctx.lineTo(VW, VH);
    ctx.lineTo(0, VH);
    ctx.closePath();
    ctx.fill();

    // Блики
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 6; i++) {
      const bx = (i * 26 + Math.floor(frames * 0.25)) % (VW + 10) - 5;
      const by = gy + 3 + (i % 3) * 2 + Math.sin(t + i) * 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 3, 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Мало карамелек — 4 штуки, плывут медленно
    drawCaramels(gy, t);
  }

  // Карамельки — их немного и они медленные
  function drawCaramels(gy, t) {
    // 4 карамельки с разными скоростями (все медленные)
    const caramels = [
      { phase: 0,   speed: 0.04, yOffset: 5,  colorSet: 0, size: 2.4 },
      { phase: 40,  speed: 0.06, yOffset: 8,  colorSet: 1, size: 2.0 },
      { phase: 80,  speed: 0.03, yOffset: 6,  colorSet: 2, size: 2.6 },
      { phase: 120, speed: 0.05, yOffset: 9,  colorSet: 3, size: 2.2 }
    ];

    const totalWidth = VW + 30;

    for (const c of caramels) {
      // Очень медленное горизонтальное движение
      const cx = ((c.phase + frames * c.speed) % totalWidth) - 15;
      // Мягкое покачивание
      const cy = gy + c.yOffset + Math.sin(t * 0.8 + c.phase) * 0.8;

      const colors = [
        ['#ff9060', '#e06830', '#ffb890'],
        ['#ffd060', '#e8a030', '#fff0a0'],
        ['#ffb0c0', '#e07090', '#ffd0e0'],
        ['#c890ff', '#9060e0', '#e0c0ff']
      ][c.colorSet];

      drawCaramel(cx, cy, c.size, colors, t + c.phase);
    }
  }

  function drawCaramel(x, y, size, colors, phase) {
    // Отражение на поверхности
    ctx.fillStyle = 'rgba(200, 170, 130, 0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + size * 0.9, size * 1.1, size * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Основа карамельки
    const grad = ctx.createRadialGradient(
      x - size * 0.3, y - size * 0.3, size * 0.1,
      x, y, size * 1.1
    );
    grad.addColorStop(0, colors[2]);
    grad.addColorStop(0.5, colors[0]);
    grad.addColorStop(1, colors[1]);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    // Контур
    ctx.strokeStyle = 'rgba(120, 60, 20, 0.4)';
    ctx.lineWidth = 0.3;
    ctx.stroke();

    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(x - size * 0.35, y - size * 0.35, size * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Обёртка — скрученные кончики
    ctx.fillStyle = colors[1];
    ctx.beginPath();
    ctx.moveTo(x - size, y);
    ctx.lineTo(x - size * 1.6, y - size * 0.6);
    ctx.lineTo(x - size * 1.5, y + size * 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + size, y);
    ctx.lineTo(x + size * 1.6, y - size * 0.6);
    ctx.lineTo(x + size * 1.5, y + size * 0.4);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- ТРУБЫ-ЕДА (как в Flappy Bird, но еда) ----------
  function drawFoodPipe(p) {
    const capH = 8;
    const capOver = 3;

    // Верхняя труба
    drawOneFoodPipe(p.x, 0, PIPE_W, p.topH - capH, p.pipeType, true);
    drawFoodCap(p.x - capOver, p.topH - capH, PIPE_W + capOver * 2, capH, p.pipeType, true);

    // Нижняя труба
    const bottomY = p.topH + p.gap;
    const bottomH = VH - GROUND_H - bottomY;
    drawOneFoodPipe(p.x, bottomY + capH, PIPE_W, bottomH - capH, p.pipeType, false);
    drawFoodCap(p.x - capOver, bottomY, PIPE_W + capOver * 2, capH, p.pipeType, false);

    // Бонус
    if (p.hasBonus && !p.bonusTaken) {
      const bx = p.x + PIPE_W / 2;
      const by = p.bonusY + Math.sin(p.bonusPhase) * 2;
      drawBonus(bx, by, p.bonusType, p.bonusPhase);
    }
  }

  // Одна часть трубы-еды (тело)
  function drawOneFoodPipe(x, y, w, h, type, isTop) {
    if (h <= 0) return;

    if (type === 'pelmen') {
      // Пельмень — светлое тесто с золотистым оттенком
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#d8b878');
      grad.addColorStop(0.2, '#f0d8a0');
      grad.addColorStop(0.5, '#fff0c8');
      grad.addColorStop(0.8, '#f0d8a0');
      grad.addColorStop(1, '#c89858');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Защипы теста — волнистые линии
      ctx.fillStyle = 'rgba(200, 152, 88, 0.5)';
      for (let i = 3; i < w - 2; i += 3) {
        ctx.fillRect(x + i, y + (i % 5), 1, h - (i % 5) * 2);
      }
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(x + 2, y + 1, 2, h - 2);
    } else if (type === 'cheburek') {
      // Чебурек — золотисто-коричневый жареный
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#a86828');
      grad.addColorStop(0.2, '#d89848');
      grad.addColorStop(0.5, '#f8d080');
      grad.addColorStop(0.8, '#d89848');
      grad.addColorStop(1, '#8a4818');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Пузырьки жарки
      ctx.fillStyle = 'rgba(120, 60, 20, 0.35)';
      for (let i = 2; i < w - 1; i += 3) {
        for (let j = 2; j < h - 2; j += 4) {
          if ((i + j) % 5 === 0) ctx.fillRect(x + i, y + j, 1, 1);
        }
      }
      // Блик
      ctx.fillStyle = 'rgba(255,240,180,0.5)';
      ctx.fillRect(x + 2, y + 1, 2, h - 2);
    } else if (type === 'sausage') {
      // Сосиска — розово-красная
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#a83820');
      grad.addColorStop(0.2, '#d85840');
      grad.addColorStop(0.5, '#ff9880');
      grad.addColorStop(0.8, '#d85840');
      grad.addColorStop(1, '#8a2818');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Прожилки жира
      ctx.fillStyle = 'rgba(255, 220, 200, 0.5)';
      for (let j = 3; j < h; j += 6) {
        ctx.fillRect(x + 3, y + j, w - 6, 1);
      }
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(x + 2, y + 1, 2, h - 2);
    } else if (type === 'sushi') {
      // Суши — тёмный нори + белый рис
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#1a2a1a');
      grad.addColorStop(0.15, '#3a4a2a');
      grad.addColorStop(0.3, '#4a5a3a');
      grad.addColorStop(0.7, '#3a4a2a');
      grad.addColorStop(1, '#1a2a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Белые полосы риса
      ctx.fillStyle = 'rgba(255, 250, 240, 0.85)';
      for (let j = 4; j < h - 3; j += 6) {
        ctx.fillRect(x + 4, y + j, w - 8, 3);
      }
      // Красная начинка
      ctx.fillStyle = 'rgba(255, 100, 80, 0.8)';
      for (let j = 5; j < h - 3; j += 6) {
        ctx.beginPath();
        ctx.arc(x + w / 2, y + j + 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x + 1, y + 1, 1, h - 2);
    } else if (type === 'donut') {
      // Пончик — розовая глазурь
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#a84080');
      grad.addColorStop(0.2, '#e078b0');
      grad.addColorStop(0.5, '#ffb0d8');
      grad.addColorStop(0.8, '#e078b0');
      grad.addColorStop(1, '#a84080');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // Посыпка
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      for (let i = 3; i < w - 2; i += 4) {
        for (let j = 3; j < h - 2; j += 5) {
          if ((i + j) % 3 === 0) ctx.fillRect(x + i, y + j, 1, 1);
        }
      }
      ctx.fillStyle = 'rgba(255, 220, 100, 0.9)';
      for (let i = 5; i < w - 2; i += 5) {
        for (let j = 5; j < h - 2; j += 6) {
          if ((i + j) % 2 === 0) ctx.fillRect(x + i, y + j, 1, 1);
        }
      }
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(x + 2, y + 1, 2, h - 2);
    }

    // Обводка
    ctx.strokeStyle = 'rgba(60, 30, 10, 0.6)';
    ctx.lineWidth = 0.6;
    ctx.strokeRect(x + 0.3, y + 0.3, w - 0.6, h - 0.6);

    // Тёмная тень справа
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(x + w - 3, y, 3, h);
  }

  // Кап (расширение) трубы-еды
  function drawFoodCap(x, y, w, h, type, isTop) {
    // Тот же цвет, что у тела
    let grad;
    if (type === 'pelmen') {
      grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#c8a860');
      grad.addColorStop(0.2, '#e8d090');
      grad.addColorStop(0.5, '#fff0c8');
      grad.addColorStop(0.8, '#e8d090');
      grad.addColorStop(1, '#b89050');
    } else if (type === 'cheburek') {
      grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#985820');
      grad.addColorStop(0.2, '#c88838');
      grad.addColorStop(0.5, '#f0c070');
      grad.addColorStop(0.8, '#c88838');
      grad.addColorStop(1, '#784010');
    } else if (type === 'sausage') {
      grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#982818');
      grad.addColorStop(0.2, '#c84830');
      grad.addColorStop(0.5, '#f88868');
      grad.addColorStop(0.8, '#c84830');
      grad.addColorStop(1, '#782010');
    } else if (type === 'sushi') {
      grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#0a1a0a');
      grad.addColorStop(0.2, '#2a3a1a');
      grad.addColorStop(0.5, '#4a5a3a');
      grad.addColorStop(0.8, '#2a3a1a');
      grad.addColorStop(1, '#0a1a0a');
    } else if (type === 'donut') {
      grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#982878');
      grad.addColorStop(0.2, '#c858a0');
      grad.addColorStop(0.5, '#f0a0c8');
      grad.addColorStop(0.8, '#c858a0');
      grad.addColorStop(1, '#982878');
    }

    ctx.fillStyle = grad;
    ctx.beginPath();
    if (isTop) {
      // Кап верхней трубы — снизу скругления
      roundRect(x, y, w, h, 2);
    } else {
      roundRect(x, y, w, h, 2);
    }
    ctx.fill();

    // Обводка капа
    ctx.strokeStyle = 'rgba(60, 30, 10, 0.7)';
    ctx.lineWidth = 0.7;
    roundRect(x, y, w, h, 2);
    ctx.stroke();

    // Блик на капе
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x + 3, y + 1, 2, h - 2);

    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x + w - 4, y, 4, h);

    // Дополнительные детали для сашими/суш
    if (type === 'sushi') {
      ctx.fillStyle = 'rgba(255, 100, 80, 0.9)';
      for (let i = 4; i < w - 3; i += 5) {
        ctx.beginPath();
        ctx.arc(x + i, y + h / 2, 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Для пельменя — волнистый край
    if (type === 'pelmen') {
      ctx.fillStyle = 'rgba(200, 152, 88, 0.7)';
      for (let i = 2; i < w - 2; i += 3) {
        ctx.fillRect(x + i, isTop ? y + h - 2 : y, 1.5, 2);
      }
    }
    // Для пончика — посыпка на капе
    if (type === 'donut') {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 4; i < w - 3; i += 3) {
        ctx.fillRect(x + i, y + 2, 1, 1);
        ctx.fillRect(x + i + 1, y + h - 3, 1, 1);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Бонусы
  function drawBonus(x, y, type, phase) {
    const auraColors = [
      'rgba(255,200,80,0.35)',
      'rgba(120,200,255,0.35)',
      'rgba(255,255,255,0.4)',
      'rgba(255,140,90,0.35)'
    ];
    const pulse = 10 + Math.sin(phase * 2) * 1.5;
    ctx.fillStyle = auraColors[type];
    ctx.beginPath();
    ctx.arc(x, y, pulse, 0, Math.PI * 2);
    ctx.fill();

    if (type === 0) {
      ctx.fillStyle = '#ff8c42';
      ctx.fillRect(x - 5, y - 4, 10, 8);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(x - 5, y - 1, 10, 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 3, y - 4, 6, 1);
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(x - 1, y - 3, 2, 1);
      ctx.fillRect(x - 2, y - 2, 1, 1);
      ctx.fillRect(x + 1, y - 2, 1, 1);
      ctx.strokeStyle = '#a04010';
      ctx.lineWidth = 0.6;
      ctx.strokeRect(x - 5.5, y - 4.5, 11, 9);
    } else if (type === 1) {
      ctx.fillStyle = '#80c8f0';
      ctx.beginPath();
      ctx.ellipse(x, y, 5, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 4, y);
      ctx.lineTo(x + 7, y - 3);
      ctx.lineTo(x + 7, y + 3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(x - 3, y - 1, 1, 1);
    } else if (type === 2) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 4, y - 5, 8, 9);
      ctx.fillStyle = '#a0d8ff';
      ctx.fillRect(x - 4, y - 1, 8, 3);
      ctx.fillStyle = '#60a8d0';
      ctx.fillRect(x - 2, y - 7, 4, 2);
      ctx.strokeStyle = '#80a8c0';
      ctx.lineWidth = 0.6;
      ctx.strokeRect(x - 4.5, y - 5.5, 9, 10);
    } else {
      ctx.fillStyle = '#d86040';
      ctx.beginPath();
      ctx.ellipse(x, y, 5, 3, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8060';
      ctx.beginPath();
      ctx.ellipse(x - 1, y - 1, 4, 2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a04020';
      ctx.fillRect(x - 5, y - 1, 2, 2);
      ctx.fillRect(x + 4, y - 1, 2, 2);
    }
  }

  // ---------- КОТИК ----------
  function drawCat(x, y, rot, wingPhase) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    if (bonusActive && state === 'play') {
      const auraR = 14 + Math.sin(frames * 0.3) * 1.5;
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, auraR);
      g.addColorStop(0, 'rgba(255,220,120,0.5)');
      g.addColorStop(0.6, 'rgba(255,200,80,0.2)');
      g.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, auraR, 0, Math.PI * 2);
      ctx.fill();
    }

    const tailWag = Math.sin(frames * 0.2) * 1.5;
    ctx.fillStyle = '#d88020';
    ctx.fillRect(-8, 0 + tailWag, 3, 5);
    ctx.fillStyle = '#e8943a';
    ctx.fillRect(-7, -1 + tailWag, 3, 4);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillRect(-7, 3 + tailWag, 3, 2);

    const wingFlap = Math.sin(wingPhase) * 4;
    ctx.fillStyle = '#f0f4ff';
    ctx.strokeStyle = '#a0b0d0';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(-1, -2);
    ctx.lineTo(-8, -6 + wingFlap);
    ctx.lineTo(-10, 0 + wingFlap);
    ctx.lineTo(-3, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#c0c8e0';
    ctx.beginPath();
    ctx.moveTo(-4, -2); ctx.lineTo(-7, -3 + wingFlap);
    ctx.moveTo(-3, 0); ctx.lineTo(-7, 0 + wingFlap);
    ctx.stroke();

    ctx.fillStyle = '#e8ecff';
    ctx.strokeStyle = '#a0b0d0';
    ctx.beginPath();
    ctx.moveTo(1, -2);
    ctx.lineTo(8, -6 + wingFlap);
    ctx.lineTo(10, 0 + wingFlap);
    ctx.lineTo(3, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#c0c8e0';
    ctx.beginPath();
    ctx.moveTo(4, -2); ctx.lineTo(7, -3 + wingFlap);
    ctx.moveTo(3, 0); ctx.lineTo(7, 0 + wingFlap);
    ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(-6, 5, 12, 2);
    ctx.fillStyle = '#e8943a';
    ctx.fillRect(-6, -4, 12, 9);
    ctx.fillStyle = '#c87020';
    ctx.fillRect(-6, -2, 2, 1);
    ctx.fillRect(4, 0, 2, 1);
    ctx.fillRect(-6, 2, 2, 1);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillRect(-4, 0, 8, 5);

    ctx.fillStyle = '#e8943a';
    ctx.fillRect(-5, -9, 10, 7);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillRect(-3, -6, 6, 4);

    ctx.fillStyle = '#e8943a';
    ctx.beginPath(); ctx.moveTo(-5, -9); ctx.lineTo(-6, -12); ctx.lineTo(-2, -9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5, -9); ctx.lineTo(6, -12); ctx.lineTo(2, -9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffb0b0';
    ctx.beginPath(); ctx.moveTo(-4.5, -9); ctx.lineTo(-5.2, -11.5); ctx.lineTo(-3, -9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4.5, -9); ctx.lineTo(5.2, -11.5); ctx.lineTo(3, -9); ctx.closePath(); ctx.fill();

    if (bird.blinking) {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(-4, -7, 3, 1);
      ctx.fillRect(1, -7, 3, 1);
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(-4, -8, 3, 3);
      ctx.fillRect(1, -8, 3, 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-4, -8, 1, 1);
      ctx.fillRect(-3, -7, 1, 1);
      ctx.fillRect(1, -8, 1, 1);
      ctx.fillRect(2, -7, 1, 1);
      ctx.fillStyle = '#4a6080';
      ctx.fillRect(-3, -7, 1, 1);
      ctx.fillRect(2, -7, 1, 1);
    }

    ctx.fillStyle = '#ff8888';
    ctx.fillRect(-1, -5, 2, 1);
    ctx.fillStyle = '#e06060';
    ctx.fillRect(-1, -4, 1, 1);

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(-1, -3, 1, 1);
    ctx.fillRect(1, -3, 1, 1);

    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(-3, -5); ctx.lineTo(-7, -6);
    ctx.moveTo(-3, -4); ctx.lineTo(-7, -3.5);
    ctx.moveTo(3, -5); ctx.lineTo(7, -6);
    ctx.moveTo(3, -4); ctx.lineTo(7, -3.5);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,150,150,0.5)';
    ctx.fillRect(-5, -6, 2, 1);
    ctx.fillRect(3, -6, 2, 1);

    ctx.fillStyle = '#e8943a';
    ctx.fillRect(-5, 4, 3, 2);
    ctx.fillRect(2, 4, 3, 2);
    ctx.fillStyle = '#ffd9a0';
    ctx.fillRect(-5, 5, 3, 1);
    ctx.fillRect(2, 5, 3, 1);

    ctx.restore();

    if (bonusActive && state === 'play') {
      ctx.strokeStyle = `rgba(255,230,120,${0.5 + Math.sin(frames * 0.4) * 0.4})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---------- UI ----------
  function drawUI() {
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3a1a08';
    ctx.fillText(String(score), VW / 2 + 1, 17);
    ctx.fillStyle = '#fff8d0';
    ctx.strokeStyle = '#3a1a08';
    ctx.lineWidth = 2.5;
    ctx.strokeText(String(score), VW / 2, 17);
    ctx.fillText(String(score), VW / 2, 17);

    ctx.font = 'bold 5px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.strokeStyle = 'rgba(58,26,8,0.8)';
    ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText('РЕКОРД: ' + best, 4, 10);
    ctx.fillText('РЕКОРД: ' + best, 4, 10);

    if (bonusActive && bonusTimer > 0) {
      const pct = bonusTimer / 500;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(VW - 42, 4, 38, 7);
      const grd = ctx.createLinearGradient(VW - 41, 0, VW - 41 + 36 * pct, 0);
      grd.addColorStop(0, '#ffe066');
      grd.addColorStop(1, '#ff8c42');
      ctx.fillStyle = grd;
      ctx.fillRect(VW - 41, 5, 36 * pct, 5);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 4px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('НЯМ!', VW - 22, 13);
    }

    if (state === 'ready') {
      ctx.fillStyle = 'rgba(58,20,8,0.82)';
      ctx.fillRect(0, VH / 2 - 42, VW, 84);
      ctx.fillStyle = '#ffcc60';
      ctx.fillRect(0, VH / 2 - 42, VW, 1);
      ctx.fillRect(0, VH / 2 + 42, VW, 1);
      ctx.fillRect(0, VH / 2 - 38, VW, 1);
      ctx.fillRect(0, VH / 2 + 38, VW, 1);

      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#3a1a08';
      ctx.lineWidth = 2.5;
      ctx.fillStyle = '#ffe066';
      ctx.strokeText('МАСТЕР', VW / 2, VH / 2 - 22);
      ctx.fillText('МАСТЕР', VW / 2, VH / 2 - 22);

      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.strokeStyle = '#3a1a08';
      ctx.lineWidth = 3;
      ctx.fillStyle = '#ff8c42';
      ctx.strokeText('ЧЕБУПЕЛЬ', VW / 2, VH / 2 - 6);
      ctx.fillText('ЧЕБУПЕЛЬ', VW / 2, VH / 2 - 6);

      ctx.font = 'bold 5px "Courier New", monospace';
      ctx.fillStyle = '#a0f0a0';
      ctx.strokeStyle = '#1a3a08';
      ctx.lineWidth = 1;
      ctx.strokeText('★ ЛЕТИ И ЖУЙ ★', VW / 2, VH / 2 + 6);
      ctx.fillText('★ ЛЕТИ И ЖУЙ ★', VW / 2, VH / 2 + 6);

      const pulse = 0.6 + Math.sin(frames * 0.12) * 0.4;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#3a1a08';
      ctx.strokeText('КЛИК / ПРОБЕЛ — лететь', VW / 2, VH / 2 + 18);
      ctx.fillText('КЛИК / ПРОБЕЛ — лететь', VW / 2, VH / 2 + 18);
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#ffd0a0';
      ctx.strokeStyle = '#3a1a08';
      ctx.strokeText('Лови еду — летать легче!', VW / 2, VH / 2 + 30);
      ctx.fillText('Лови еду — летать легче!', VW / 2, VH / 2 + 30);
    }

    if (state === 'dead') {
      ctx.fillStyle = 'rgba(58,20,8,0.85)';
      ctx.fillRect(0, VH / 2 - 36, VW, 72);
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(0, VH / 2 - 36, VW, 1);
      ctx.fillRect(0, VH / 2 + 36, VW, 1);

      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#1a0a04';
      ctx.lineWidth = 2.5;
      ctx.fillStyle = '#ff6b6b';
      ctx.strokeText('МЯУ...', VW / 2, VH / 2 - 18);
      ctx.fillText('МЯУ...', VW / 2, VH / 2 - 18);

      ctx.font = 'bold 5px "Courier New", monospace';
      ctx.fillStyle = '#ffe066';
      ctx.strokeStyle = '#3a1a08';
      ctx.lineWidth = 1;
      ctx.strokeText('Счёт: ' + score, VW / 2, VH / 2 - 6);
      ctx.fillText('Счёт: ' + score, VW / 2, VH / 2 - 6);

      ctx.fillStyle = '#a0d8ff';
      ctx.strokeText('Рекорд: ' + best, VW / 2, VH / 2 + 3);
      ctx.fillText('Рекорд: ' + best, VW / 2, VH / 2 + 3);

      if (frames > 25) {
        const alpha = 0.5 + Math.sin(frames * 0.15) * 0.5;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.strokeText('Нажми — играть снова', VW / 2, VH / 2 + 22);
        ctx.fillText('Нажми — играть снова', VW / 2, VH / 2 + 22);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- Главный цикл ----------
  let lastTime = 0;
  const FPS = 60;
  const interval = 1000 / FPS;
  let accumulator = 0;

  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = t - lastTime;
    lastTime = t;
    if (dt > 100) dt = 100;
    accumulator += dt;

    while (accumulator >= interval) {
      update();
      accumulator -= interval;
    }

    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
